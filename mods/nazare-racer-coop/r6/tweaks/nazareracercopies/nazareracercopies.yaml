# Two more Nazare "Racer" bikes, so three NightCoop players can each ride one.
# NightCoop treats player bikes of one record as one bike, so each rider needs their own record.
# Everyone in the session needs this file, since a partner's bike is spawned by its record.
# The names come from nazareracercopies.archive in archive/pc/mod.
#
# The host rides the original. The other two each unlock one copy in the CET console:
# Game.GetVehicleSystem():EnablePlayerVehicle('Vehicle.v_sportbike2_arch_player_02_kuro',true,false)
# Game.GetVehicleSystem():EnablePlayerVehicle('Vehicle.v_sportbike2_arch_player_02_shiro',true,false)

Vehicle.v_sportbike2_arch_player_02_kuro:
  $base: Vehicle.v_sportbike2_arch_player_02
  displayName: nazare_racer_kuro_name

Vehicle.v_sportbike2_arch_player_02_shiro:
  $base: Vehicle.v_sportbike2_arch_player_02
  displayName: nazare_racer_shiro_name

Vehicle.vehicle_list.list:
  - !append Vehicle.v_sportbike2_arch_player_02_kuro
  - !append Vehicle.v_sportbike2_arch_player_02_shiro
