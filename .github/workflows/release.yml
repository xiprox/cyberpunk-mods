# release-please reads the conventional commits on main and keeps one release pull request open for each mod in
# release-please-config.json, with its next version and changelog. Merging one tags the version and publishes a GitHub
# release, and the package job then zips that mod with tools/package-mod.ps1, attaches the zip, and uploads it to
# Nexus Mods. Run the workflow by hand with a mod's folder for a dry run: it zips the mod and keeps the zip as the
# run's artifact, and releases nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mod:
        description: "A mod's folder, such as mods/headset, to zip without releasing"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      paths: ${{ steps.release.outputs.paths_released }}
      # Every output, since each mod's are named after its folder, such as mods/headset--tag_name.
      all: ${{ toJSON(steps.release.outputs) }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  package:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.released == 'true') }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        path: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.mod)) || fromJSON(needs.release-please.outputs.paths) }}
    env:
      MOD_PATH: ${{ matrix.path }}
      TAG: ${{ fromJSON(needs.release-please.outputs.all || '{}')[format('{0}--tag_name', matrix.path)] }}
      VERSION: ${{ fromJSON(needs.release-please.outputs.all || '{}')[format('{0}--version', matrix.path)] }}
    steps:
      - uses: actions/checkout@v7

      # The mod's Nexus Mods variables are named after its folder: mods/nightcoop-voice has NEXUSMODS_NIGHTCOOP_VOICE_MOD_ID.
      - name: Read the mod's release settings
        id: meta
        run: |
          $meta = Get-Content "$env:MOD_PATH/release.json" -Raw | ConvertFrom-Json
          $name = Split-Path $env:MOD_PATH -Leaf
          $version = if ($env:VERSION) { $env:VERSION } else { (Get-Content "$env:MOD_PATH/version.txt" -TotalCount 1).Trim() }
          Add-Content -Path $env:GITHUB_OUTPUT -Value @(
            "name=$name",
            "key=$(($name -replace '-', '_').ToUpper())",
            "version=$version",
            "zip=$($meta.zip)-$version.zip",
            "title=$($meta.title)"
          )

      - name: Zip the mod
        run: ./tools/package-mod.ps1 -Mod ${{ steps.meta.outputs.name }} -Version ${{ steps.meta.outputs.version }} -OutDir .

      - name: Keep the zip of a dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip }}
          path: ${{ steps.meta.outputs.zip }}

      - name: Attach the zip to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:TAG ${{ steps.meta.outputs.zip }} --repo $env:GITHUB_REPOSITORY

      # Nexus Mods only takes a new version of a file already on the mod page, so the first upload is made by hand on
      # the site. Until the repository has both of the mod's variables, its releases skip these steps.
      - name: Turn the release notes into a Nexus Mods changelog
        id: notes
        if: github.event_name == 'push' && vars[format('NEXUSMODS_{0}_MOD_ID', steps.meta.outputs.key)] != '' && vars[format('NEXUSMODS_{0}_FILE_ID', steps.meta.outputs.key)] != ''
        env:
          BODY: ${{ fromJSON(needs.release-please.outputs.all || '{}')[format('{0}--body', matrix.path)] }}
        run: |
          # Nexus takes one entry per line and shows Markdown as typed, so keep only the list items,
          # without the "* ", the scope such as "**settings:** ", or the links such as
          # " ([1a2b3c4](https://...))". A breaking change is listed twice, under its own heading and
          # its type's, so it's kept once.
          $entries = $env:BODY -split '\r?\n' | Where-Object { $_ -match '^\* ' } | ForEach-Object {
            $entry = $_ -replace '^\* (\*\*[^*]+:\*\* )?', '' -replace ' \(\[[^\]]+\]\([^)]+\)\)', ''
            $entry.Substring(0, 1).ToUpper() + $entry.Substring(1)
          }
          $notes = ($entries | Select-Object -Unique) -join "`n"
          $delimiter = "EOF$([guid]::NewGuid().ToString('N'))"
          "changelog<<$delimiter", $notes, $delimiter | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Upload to Nexus Mods
        if: steps.notes.outcome == 'success'
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars[format('NEXUSMODS_{0}_MOD_ID', steps.meta.outputs.key)] }}
          file_id: ${{ vars[format('NEXUSMODS_{0}_FILE_ID', steps.meta.outputs.key)] }}
          filename: ${{ steps.meta.outputs.zip }}
          version: ${{ steps.meta.outputs.version }}
          display_name: ${{ steps.meta.outputs.title }}
          changelog: ${{ steps.notes.outputs.changelog }}
          archive_existing_version: true
          update_mod_version: true
          # Keeps mod managers' default download on the newest version, as the first upload was.
          primary_mod_manager_download: true
